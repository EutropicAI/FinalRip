apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-server
  namespace: finalrip
spec:
  template:
    spec:
      containers:
      - name: server
        env:
        - name: FINALRIP_LOG_LEVEL
          value: "debug"
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "250m"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-worker-encode
  namespace: finalrip
spec:
  replicas: 1  # Single replica for development
  template:
    spec:
      containers:
      - name: worker-encode
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1"
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finalrip-ingress
  namespace: finalrip
spec:
  rules:
  - host: finalrip-dev.local