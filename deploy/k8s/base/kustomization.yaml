apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: finalrip-base

resources:
- namespace.yaml
- configmap.yaml
- secrets.yaml
- mongodb.yaml
- redis.yaml
- minio.yaml
- consul.yaml
- asynqmon.yaml
- server.yaml
- dashboard.yaml
- workers.yaml
- worker-encode.yaml
- ingress.yaml

commonLabels:
  app.kubernetes.io/part-of: finalrip

images:
- name: lychee0/finalrip:server-dev
  newTag: latest
- name: lychee0/finalrip:dashboard-dev
  newTag: latest
- name: lychee0/finalrip:worker-cut-dev
  newTag: latest
- name: lychee0/finalrip:worker-merge-dev
  newTag: latest
- name: lychee0/finalrip:worker-encode-cuda-dev
  newTag: latest