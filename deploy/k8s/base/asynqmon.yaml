apiVersion: apps/v1
kind: Deployment
metadata:
  name: asynqmon
  namespace: finalrip
  labels:
    app.kubernetes.io/name: asynqmon
    app.kubernetes.io/component: monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: asynqmon
  template:
    metadata:
      labels:
        app.kubernetes.io/name: asynqmon
        app.kubernetes.io/component: monitor
    spec:
      containers:
      - name: asynqmon
        image: hibiken/asynqmon:latest
        ports:
        - containerPort: 8080
        env:
        - name: REDIS_ADDR
          value: "redis:6379"
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: finalrip-secrets
              key: redis-password
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "100m"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: asynqmon
  namespace: finalrip
  labels:
    app.kubernetes.io/name: asynqmon
    app.kubernetes.io/component: monitor
spec:
  selector:
    app.kubernetes.io/name: asynqmon
  ports:
  - port: 8080
    targetPort: 8080