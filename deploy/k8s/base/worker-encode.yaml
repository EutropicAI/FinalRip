apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-worker-encode
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-worker-encode
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finalrip-worker-encode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finalrip-worker-encode
        app.kubernetes.io/component: worker
    spec:
      containers:
      - name: worker-encode
        image: lychee0/finalrip:worker-encode-cuda-dev
        env:
        - name: FINALRIP_REMOTE_CONFIG_HOST
          value: "consul:8500"
        - name: FINALRIP_DB_HOST
          value: "mongodb"
        - name: FINALRIP_REDIS_HOST
          value: "redis"
        - name: FINALRIP_OSS_ENDPOINT
          value: "minio:9000"
        - name: TZ
          value: "Asia/Shanghai"
        command: ["/app/worker", "encode"]
        volumeMounts:
        - name: config
          mountPath: /app/conf
          readOnly: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
            nvidia.com/gpu: 1
          limits:
            memory: "4Gi"
            cpu: "2"
            nvidia.com/gpu: 1
        livenessProbe:
          exec:
            command:
            - pgrep
            - worker
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pgrep
            - worker
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: finalrip-config
      nodeSelector:
        accelerator: nvidia-tesla-gpu  # Adjust based on your GPU nodes
      tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule