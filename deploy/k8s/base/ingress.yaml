apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finalrip-ingress
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  ingressClassName: nginx  # Adjust based on your ingress controller
  rules:
  - host: finalrip.local  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: finalrip-dashboard
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: finalrip-server
            port:
              number: 8848
      - path: /asynq
        pathType: Prefix
        backend:
          service:
            name: asynqmon
            port:
              number: 8080
      - path: /minio
        pathType: Prefix
        backend:
          service:
            name: minio
            port:
              number: 9001
      - path: /consul
        pathType: Prefix
        backend:
          service:
            name: consul
            port:
              number: 8500