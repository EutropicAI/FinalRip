apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-server
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-server
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finalrip-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finalrip-server
        app.kubernetes.io/component: server
    spec:
      containers:
      - name: server
        image: lychee0/finalrip:server-dev
        ports:
        - containerPort: 8848
        env:
        - name: FINALRIP_REMOTE_CONFIG_HOST
          value: "consul:8500"
        - name: FINALRIP_DB_HOST
          value: "mongodb"
        - name: FINALRIP_REDIS_HOST
          value: "redis"
        - name: FINALRIP_OSS_ENDPOINT
          value: "minio:9000"
        - name: TZ
          value: "Asia/Shanghai"
        command: ["/app/server", "server"]
        volumeMounts:
        - name: config
          mountPath: /app/conf
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /ping
            port: 8848
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: 8848
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: finalrip-config
---
apiVersion: v1
kind: Service
metadata:
  name: finalrip-server
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-server
    app.kubernetes.io/component: server
spec:
  selector:
    app.kubernetes.io/name: finalrip-server
  ports:
  - port: 8848
    targetPort: 8848