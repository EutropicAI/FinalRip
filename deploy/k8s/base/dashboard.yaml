apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-dashboard
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-dashboard
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finalrip-dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finalrip-dashboard
        app.kubernetes.io/component: frontend
    spec:
      containers:
      - name: dashboard
        image: lychee0/finalrip:dashboard-dev
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: finalrip-dashboard
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-dashboard
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: finalrip-dashboard
  ports:
  - port: 80
    targetPort: 80