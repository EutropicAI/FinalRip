apiVersion: apps/v1
kind: Deployment
metadata:
  name: finalrip-worker-cut
  namespace: finalrip
  labels:
    app.kubernetes.io/name: finalrip-worker-cut
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finalrip-worker-cut
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finalrip-worker-cut
        app.kubernetes.io/component: worker
    spec:
      containers:
      - name: worker-cut
        image: lychee0/finalrip:worker-cut-dev
        env:
        - name: FINALRIP_REMOTE_CONFIG_HOST
          value: "consul:8500"
        - name: FINALRIP_DB_HOST
          value: "mongodb"
        - name: FINALRIP_REDIS_HOST
          value: "redis"
        - name: FINALRIP_OSS_ENDPOINT
          value: "minio:9000"
        - name: TZ
          value: "Asia/Shanghai"
        command: ["/app/worker", "cut"]
        volumeMounts:
        - name: config
          mountPath: /app/conf
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          exec:
            command:
            - pgrep
            - worker
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pgrep
            - worker
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: finalrip-config
---
